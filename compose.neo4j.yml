name: neo4j-stack

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j-gds
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    volumes:
      - _neo4j_data:/data
      - _neo4j_logs:/logs
      - _neo4j_plugins:/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  _neo4j_data:
    name: _neo4j_data
    external: true
  _neo4j_logs:
    name: _neo4j_logs
    external: true
  _neo4j_plugins:
    name: _neo4j_plugins
    external: true

