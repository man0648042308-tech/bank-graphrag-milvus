[project]
name = "day3536-graphrag-homework"
version = "0.1.0"
description = "Day35/Day36 Neo4j GDS, GraphRAG, Milvus and safe NL query homework"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0,<2",
    "neo4j>=6.0,<7",
    "pymilvus>=2.6.17,<2.7",
    "pymysql>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "sqlglot>=27,<29",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
day3536-demo = "day3536_homework.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/day3536_homework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
